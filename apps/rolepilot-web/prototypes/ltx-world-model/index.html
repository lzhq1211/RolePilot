k{opacity:0}.controller.selected .capsule{left:calc(50% - 100px);width:200px;background:#f6fbff24}.controller.selected .track{opacity:0}.controller.selected .cell:not(.selected){opacity:0;pointer-events:none}.controller.selected .cell.selected button{opacity:1;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}.controller.selected .cell.selected{grid-column:1/-1}.notice,.live{position:absolute;z-index:40}.notice{left:24px;bottom:24px;font-size:12px;opacity:.7}.live{width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}header{position:absolute;top:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:calc(58px + env(safe-area-inset-top)) 40px 40px;text-shadow:0 1px 6px #0000002e}header a{display:flex}header svg{height:24px;width:auto}.meta{display:flex;margin-left:clamp(48px,5vw,70px);gap:clamp(28px,3vw,44px);font-size:18px;line-height:1.2;letter-spacing:-.04em}.try{width:152px;height:38px;border:1px solid #ffffffbf;border-radius:999px;background:transparent;color:#fff;font:inherit;font-size:18px;cursor:pointer;transition:color 300ms,background 300ms,border-color 300ms}.try:hover,.try:focus-visible{background:#fff;color:#0b1a26;border-color:#fff;outline:0}.reset{position:absolute;inset:0;display:none;align-items:center;justify-content:center}.controller.selected .reset{display:flex}.reset button{all:unset;cursor:pointer}

<script>
(()=>{const stage=document.querySelector('.stage'),controller=document.querySelector('.controller'),title=document.querySelector('.hero'),live=document.querySelector('.live'),videos=[...document.querySelectorAll('.media')],buttons=[...document.querySelectorAll('.cell button')],reset=document.querySelector('.reset button');let busy=false,selected=null,visible=videos[0];const map={scene:'scene',light:'light',colorway:'colorway',fullLook:'fullLook'};function say(t){live.textContent=t}function pos(i){controller.style.setProperty('--cap-left',i===0?'-5px':`${i*20}%`);controller.style.setProperty('--cap-width',i===0?'calc(20% + 5px)':'20%')}function reveal(v){visible.classList.remove('visible');v.classList.add('visible');visible=v}function play(v,hold=.08){return new Promise((resolve,reject)=>{let done=false;const finish=()=>{if(done)return;done=true;v.pause();v.currentTime=Math.max(0,v.duration-hold);resolve()};v.currentTime=0;const timer=setTimeout(()=>reject(new Error('Video frame timeout')),12000);v.onended=finish;v.addEventListener('timeupdate',()=>{if(v.duration-v.currentTime<=hold) {clearTimeout(timer);finish()}},{once:false});const p=v.play();if(p)p.catch(e=>{clearTimeout(timer);reject(e)});})}async function forward(key){if(busy||selected)return;busy=true;buttons.forEach(b=>b.disabled=true);selected=key;controller.classList.add('hovered','collapsed');title.classList.add('title-hidden');say('Loading '+key);const v=document.querySelector(`[data-key="${key}"]`);try{await play(v);reveal(v);controller.classList.add('selected');controller.classList.remove('collapsed');say(key+' selected.');}catch(e){selected=null;controller.classList.remove('collapsed','selected');title.classList.remove('title-hidden');buttons.forEach(b=>b.disabled=false);say('Unable to load transition. Try again.');}busy=false}async function reverse(){if(busy||!selected)return;busy=true;reset.disabled=true;say('Returning to base');const key=selected;const v=document.querySelector(`[data-key="${key}-reverse"]`);controller.classList.remove('selected');controller.classList.add('collapsed');try{await play(v,.18);reveal(videos[0]);videos[0].pause();videos[0].currentTime=0;controller.classList.remove('collapsed');pos(0);title.classList.remove('title-hidden');selected=null;buttons.forEach(b=>b.disabled=false);say('Base scene ready.');}catch(e){controller.classList.remove('collapsed','selected');reset.disabled=false;say('Unable to return. Try again.')}busy=false}buttons.forEach((b,i)=>{b.addEventListener('mouseenter',()=>{if(!selected&&!busy){controller.classList.add('hovered');pos(i+1)}});b.addEventListener('focus',()=>{if(!selected&&!busy){controller.classList.add('hovered');pos(i+1)}});b.addEventListener('click',()=>forward(b.dataset.key))});controller.addEventListener('mouseleave',()=>{if(!selected&&!busy){controller.classList.remove('hovered');pos(0)}});reset.addEventListener('click',reverse);videos[0].addEventListener('loadeddata',()=>{videos[0].pause();videos[0].currentTime=0;reveal(videos[0])});pos(0)})();
</script></body></html>
